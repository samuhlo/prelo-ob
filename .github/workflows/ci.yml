name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: prelo-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: plugin
      - run: npm audit --audit-level=high
        if: runner.os == 'Linux'
        working-directory: plugin
      - run: npm test
        working-directory: plugin
      - run: npm run build
        working-directory: plugin
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - run: python scripts/audit_public.py
  service:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements.lock
      - run: python -m pip install pytest
      - run: python -m pip install --no-deps -e server
      - run: python -m pytest server/tests -q
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r server/requirements.lock --no-deps --disable-pip
      - run: docker build -t prelo-ci server
      - run: python scripts/smoke_service.py --image prelo-ci --output data/validation
      - run: python scripts/fetch_epubcheck.py
      - run: python scripts/validate_epub.py data/validation/study.epub
      - run: python scripts/validate_epub.py data/validation/retro.epub
      - run: python -m pip install pymupdf
      - run: python scripts/check_caption_layout.py data/validation/retro.epub --output data/validation/layout
