name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: plugin
      - run: npm audit --audit-level=high
        if: runner.os == 'Linux'
        working-directory: plugin
      - run: npm test
        working-directory: plugin
      - run: npm run build
        working-directory: plugin
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - run: python scripts/audit_public.py
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements.lock
      - run: python -m pip install pytest
      - run: python -m pip install --no-deps -e server
      - run: python -m pytest server/tests -q
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r server/requirements.lock --no-deps --disable-pip
      - run: docker build -t prelo-ci server
