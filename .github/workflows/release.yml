name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci && npm test && npm run build
        working-directory: plugin
      - run: python -m pip install -r server/requirements.lock
      - run: python -m pip install pytest
      - run: python -m pip install --no-deps -e server
      - run: python -m pytest server/tests tests -q
      - name: Check beta acceptance
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_beta import check
          root = Path.cwd()
          record = json.loads((root / 'docs/beta-acceptance.json').read_text())
          errors = check(root)
          # Owner-authorized exceptions for this personal beta only, per version.
          # The version match and the product fingerprint always remain required.
          WAIVERS = {'1.0.0': {'clean_mac_install'},
                     '1.0.1': {'clean_mac_install', 'obsidian_upgrade', 'usb_roundtrip', 'backup_recovery'}}
          allowed = WAIVERS.get(record.get('version'), set())
          def approved(name):
              item = record.get('checks', {}).get(name, {})
              return (name in allowed and item.get('status') == 'waived'
                      and item.get('approved_by') == 'owner'
                      and bool(item.get('date')) and bool(item.get('summary')))
          pending = [error.removeprefix('Pendiente: ') for error in errors if error.startswith('Pendiente: ')]
          waived = bool(errors) and len(pending) == len(errors) and all(approved(name) for name in pending)
          if errors and not waived:
              raise SystemExit('\n'.join(errors))
          if waived:
              print(f"{record['version']}: {', '.join(pending)} explicitly waived by owner; not certified.")
          PY
      - run: python scripts/audit_public.py && python scripts/build_release.py
      - name: Check version and publish beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python -c 'import json,os; assert json.load(open("manifest.json"))["version"] == os.environ["RELEASE_TAG"]'
          gh release create "$RELEASE_TAG" dist/releases/"$RELEASE_TAG"/* --verify-tag --title "$RELEASE_TAG" --prerelease --notes-file .github/RELEASE_NOTES.md
